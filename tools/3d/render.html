  const txt = new THREE.MeshStandardMaterial({ color: 0xbff5d6, emissive: 0x8ff0bb, emissiveIntensity: 1.2 }); for (const [w, y] of [[.3, .63], [.22, .6], [.26, .57]]) { const t = new THREE.Mesh(new THREE.BoxGeometry(w, .012, .002), txt); t.position.set(-.16 + w / 2, y, .089); g.add(t); }
  for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) { const k = new THREE.Mesh(new RoundedBoxGeometry(.07, .05, .02, 2, .008), c === 1 && r === 3 ? M.brass : metalGraph); k.position.set(-.1 + c * .1, .36 - r * .07, .085); g.add(k); }
  const badge = new THREE.Mesh(new RoundedBoxGeometry(.5, .025, .006, 2, .006), M.brass); badge.position.set(0, .7, .082); g.add(badge);
  return g;
}

window.renderAll = () => {
  const out = {};
  // макет: общий вид (все системы) и три приближения
  state('all'); const hc = camLook([-6.3, 6.9, 7.9], [0.25, -0.1, 0.1], 26); out.hero = shot(mscene, hc, 1800, 1300);
  const pr = (px, py, y) => { const [a, b] = P(px, py); const v = new THREE.Vector3(a, y, b).project(hc); return [(v.x + 1) / 2 * 1800, (1 - v.y) / 2 * 1300]; };
  out.anchors = JSON.stringify({ detector: pr(200, 128, H - .02), camera: pr(372, 28, H - .02), reader: pr(81, 255, .2), panel: pr(249, 395, .2) });
  state('fire'); out.fire = shot(mscene, camLook([-6.6, 9.6, 8.1], [0.1, -0.1, 0.1], 26), 1300, 1300);
  state('video'); out.video = shot(mscene, camLook([-3.1, 4.6, 2.5], [0.1, 0, -1.15], 30), 1300, 1300);
  state('access'); out.access = shot(mscene, camLook([-2.6, 4.3, 3.9], [-1.0, 0.0, 1.2], 30), 1300, 1300);
  // устройства
  for (const [k, fn, pos, tgt] of [['detector', detector, [1.3, 1.25, 2.2], [0, .12, 0]], ['camera', domeCam, [1.3, 1.25, 2.2], [0, .18, 0]], ['reader', reader, [1.15, 1.0, 2.6], [.22, .28, .05]], ['panel', panel, [1.0, .95, 2.4], [0, .37, 0]]]) {
    const { s, cam } = deviceScene(fn, pos, tgt, 22); out[k] = shot(s, cam, 1000, 1000);
  }
  return out;
};
